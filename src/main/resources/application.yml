spring:
  application:
    name: event-reliability-platform
  jackson:
    property-naming-strategy: SNAKE_CASE

management:
  metrics:
    tags:
      application: ${spring.application.name}
      component: ${PLATFORM_MODE:all}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        events.processing.latency: true
      maximum-expected-value:
        events.processing.latency: 5m
      percentiles:
        http.server.requests: 0.5,0.95,0.99
        events.processing.latency: 0.5,0.95,0.99
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

platform:
  runtime:
    mode: ${PLATFORM_MODE:all}
  processing:
    claim-timeout: ${PROCESSING_CLAIM_TIMEOUT:55s}
  workers:
    count: ${WORKER_COUNT:4}
  retry:
    max-attempts: ${MAX_ATTEMPTS:4}
    initial-backoff-ms: ${INITIAL_BACKOFF_MS:250}
  reconciliation:
    interval-ms: ${RECONCILIATION_INTERVAL_MS:5000}
    stale-after: ${RECONCILIATION_STALE_AFTER:5s}
