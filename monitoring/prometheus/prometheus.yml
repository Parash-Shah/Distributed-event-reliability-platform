global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: localstack

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: event-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["event-platform-aws:8080"]

  - job_name: event-workers
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["event-worker-aws"]
        type: A
        port: 8080
        refresh_interval: 15s

  - job_name: event-reconciliation
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["event-reconciliation-aws:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
